<!doctype html>
<html lang="it">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <!-- Il foglio di stile dei font era un <link rel="stylesheet"> bloccante verso un'origine
       terza: il primo paint aspettava due round-trip fuori dal nostro controllo.
       Ora si carica in modo asincrono (media="print" + onload) e il testo compare subito
       con i fallback di sistema, poi passa a Inter/Manrope — coerente con display=swap,
       che già prevede quello scambio. Il <noscript> copre i browser senza JS. -->
  <link rel="preload" as="style"
    href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&family=Inter:wght@400;500;600&display=swap" />
  <link rel="stylesheet" media="print" onload="this.media='all'"
    href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&family=Inter:wght@400;500;600&display=swap" />
  <noscript>
    <link rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&family=Inter:wght@400;500;600&display=swap" />
  </noscript>

  <!-- PWA Meta Tags -->
  <meta name="theme-color" content="#3d6fd6" />
  <meta name="description" content="Gestisci le tue finanze personali con facilità" />
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon-v2.png" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="NexaBudget" />

  <title>NexaBudget</title>
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
